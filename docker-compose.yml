services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 }).ok' | mongosh localhost:27017/test --quiet | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  product-service:
    build:
      context: ./product-service
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_HOST: mongo
      MONGODB_PORT: "27017"
    ports:
      - "8081:8081"

  order-service:
    build:
      context: ./order-service
    depends_on:
      mongo:
        condition: service_healthy
      product-service:
        condition: service_started
    environment:
      MONGODB_HOST: mongo
      MONGODB_PORT: "27017"
      PRODUCT_SERVICE_URL: http://product-service:8081
    ports:
      - "8082:8082"

volumes:
  mongo-data:
