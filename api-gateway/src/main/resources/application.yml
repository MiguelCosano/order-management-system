server:
  port: 8080

  spring:
    application:
      name: api-gateway
    cloud:
      gateway:
        server:
          webmvc:
            routes:
              - id: order-service
                uri: http://localhost:8082
                predicates:
                  - Path=/api/orders/**
                filters:
                  - StripPrefix=1

              - id: product-service
                uri: http://localhost:8081
                predicates:
                  - Path=/api/products/**
                filters:
                  - StripPrefix=1

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics